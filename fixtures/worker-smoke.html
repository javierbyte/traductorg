<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCR worker smoke test</title>
  <style>
    body { margin: 32px; background: #111827; color: white; font: 16px/1.5 system-ui, sans-serif; }
    pre { padding: 18px; border-radius: 12px; background: #030712; color: #86efac; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>OCR worker smoke test</h1>
  <pre id="result">Starting worker…</pre>
  <script type="module">
    const result = document.getElementById("result");
    const modelId = new URLSearchParams(location.search).get("model") === "zh"
      ? "zh"
      : "latin";
    const worker = new Worker("../ocr-worker.js", { type: "module" });
    const canvas = new OffscreenCanvas(1280, 720);
    const context = canvas.getContext("2d");
    context.fillStyle = "white";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "black";
    context.font = "52px sans-serif";
    context.fillText(
      modelId === "zh" ? "翻译性能测试" : "Translation café performance test",
      90,
      180,
    );
    let phase = "init";
    const timeout = setTimeout(() => {
      result.textContent = `FAIL: worker ${phase} timed out`;
      document.documentElement.dataset.result = "fail";
      worker.terminate();
    }, 60_000);

    async function sendSample() {
      phase = "sample";
      const bitmap = await createImageBitmap(canvas, {
        resizeWidth: 64,
        resizeHeight: 200,
        resizeQuality: "pixelated",
      });
      worker.postMessage({
        type: "sample",
        sessionId: 1,
        frameId: 1,
        displayHeight: 720,
        bitmap,
      }, [bitmap]);
    }

    async function sendOcr() {
      phase = "ocr";
      result.textContent = "Running one full OCR pass…";
      const bitmap = await createImageBitmap(canvas);
      worker.postMessage({
        type: "ocr",
        sessionId: 1,
        frameId: 2,
        displayHeight: 720,
        captureScrollBase: 0,
        bitmap,
      }, [bitmap]);
    }

    worker.addEventListener("message", (event) => {
      const message = event.data;
      if (message.type === "status") result.textContent = message.message;
      if (message.type === "ready") {
        result.textContent = `${message.modelId} OCR ready with ${message.threads} thread(s)`;
        void sendSample();
      }
      if (message.type === "motion" && phase === "sample") void sendOcr();
      if (message.type === "ocr-result") {
        clearTimeout(timeout);
        result.textContent = `PASS: ${modelId} full OCR path, ${message.counts.selected} readable region(s), ${Math.round(message.durationMs)} ms`;
        document.documentElement.dataset.result = "pass";
        worker.terminate();
      }
      if (message.type === "error") {
        clearTimeout(timeout);
        result.textContent = `FAIL (${message.stage}): ${message.error.message}`;
        document.documentElement.dataset.result = "fail";
        worker.terminate();
      }
    });
    worker.addEventListener("error", (event) => {
      clearTimeout(timeout);
      result.textContent = `FAIL: ${event.message}`;
      document.documentElement.dataset.result = "fail";
    });
    worker.postMessage({ type: "init", sessionId: 1, frameId: 0, modelId });
  </script>
</body>
</html>
