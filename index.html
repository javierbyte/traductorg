<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Translation Glass — Live on-device translation</title>
  <meta name="description"
    content="Share a screen and see its text translated on-device, overlaid live on the feed." />
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://www.modelscope.cn" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <video autoplay muted playsinline></video>
  <div id="translate-overlay"></div>

  <!-- Persistent language bar, shown only during a translation session. -->
  <div id="lang-bar"></div>

  <div id="intro">
    <div id="intro-lang"></div>
    <p>
      Share a screen with text in the source language<br />
      to see it translated live.
    </p>
    <button id="share-btn">Share video to translate</button>
    <p>
      Chrome only. Translation runs on-device.
    </p>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
